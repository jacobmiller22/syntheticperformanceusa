# Cloudflare Workers Configuration for Synthetic Performance USA (AMSOIL Dealer Site)
name = "syntheticperformanceusa"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom Domains for syntheticperformanceusa.com
# Cloudflare automatically provisions DNS records and edge SSL certificates
routes = [
  { pattern = "syntheticperformanceusa.com", custom_domain = true },
  { pattern = "www.syntheticperformanceusa.com", custom_domain = true }
]

# Static Assets served directly from Cloudflare's Edge CDN
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Dealer Variables (Dynamically editable anytime without rebuilding frontend)
[vars]
DEALER_ZO = "31977476"
DEALER_NAME = "Brandon Miller"
DEALER_EMAIL = "syntheticperformanceusa@gmail.com"
DEALER_LOCATION = "Serving Customers Nationwide"
